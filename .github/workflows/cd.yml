name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race onto the same box.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    outputs:
      server_image: ${{ steps.meta.outputs.server_image }}
      client_image: ${{ steps.meta.outputs.client_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR requires a lowercase path; org/repo names may not be.
          prefix="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "server_image=${prefix}/server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "client_image=${prefix}/client:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.server_image }}
            ${{ steps.meta.outputs.prefix }}/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # Compiled into the bundle, so an unset value cannot be corrected later by
      # restarting the container - it ships a client pointing at localhost.
      - name: Warn if client API URL is unset
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning title=VITE_API_URL not set::The client bundle falls back to http://localhost:5000/api, which a browser cannot reach unless it is running on the server itself. Set the VITE_API_URL secret and re-run."
          fi

      # VITE_* values are compiled into the bundle here and cannot be changed
      # later by the running container, so they must be supplied as build args.
      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.meta.outputs.client_image }}
            ${{ steps.meta.outputs.prefix }}/client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Add required reviewers to this environment in repo settings if you want
    # deploys to be manually approved.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Runs before anything touches SSH. Without this, an unset secret surfaces
      # as `ssh-keyscan` exiting 1 against an empty host, which says nothing
      # about the actual cause.
      - name: Check deployment configuration
        id: preflight
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          access_set=0
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -n "${!v}" ]; then access_set=1; fi
          done

          # No VPS configured at all: images are still built and pushed, but
          # there is nowhere to deploy to. Report it clearly and succeed rather
          # than failing every push to main until someone sets the secrets.
          if [ "$access_set" -eq 0 ]; then
            echo "::warning title=Deploy skipped::No SSH secrets are set, so there is no VPS to deploy to. See DEPLOYMENT.md."
            {
              echo "### Deploy skipped - no VPS configured"
              echo
              echo "Images were built and pushed to GHCR, but \`SSH_HOST\`, \`SSH_USER\` and"
              echo "\`SSH_PRIVATE_KEY\` are unset, so nothing was deployed."
              echo
              echo "See \`DEPLOYMENT.md\` for the full list of required secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Partially configured is a real mistake - name every missing secret
          # at once instead of failing on whichever is reached first.
          missing=""
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY MONGO_USER MONGO_PASSWORD \
                   JWT_SECRET SESSION_SECRET STRIPE_SECRET_KEY CLIENT_URL \
                   R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                   R2_BUCKET_NAME R2_PUBLIC_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Incomplete deploy configuration::Missing required secrets:$missing"
            {
              echo "### Deploy failed - incomplete configuration"
              echo
              echo "These required secrets are not set:"
              for v in $missing; do echo "- \`$v\`"; done
              echo
              echo "See \`DEPLOYMENT.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          touch ~/.ssh/known_hosts
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Preferred: pinned host key, immune to a spoofed host.
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Fallback: trust-on-first-use. Set the SSH_KNOWN_HOSTS secret to
            # remove this window.
            if ! ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "::error title=Cannot reach host::ssh-keyscan failed for $SSH_HOST:${SSH_PORT:-22}. Check SSH_HOST, SSH_PORT, and that the VPS allows inbound SSH."
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Write deployment env file
        if: steps.preflight.outputs.configured == 'true'
        env:
          SERVER_IMAGE: ${{ needs.build-and-push.outputs.server_image }}
          CLIENT_IMAGE: ${{ needs.build-and-push.outputs.client_image }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SERVER_PUBLIC_URL: ${{ secrets.SERVER_PUBLIC_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          REGCHECK_USERNAME: ${{ secrets.REGCHECK_USERNAME }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
        run: |
          # Built on the runner then copied, so compose reads plain values and
          # we avoid quoting problems from interpolating secrets into SSH.
          for var in SERVER_IMAGE CLIENT_IMAGE MONGO_USER MONGO_PASSWORD MONGO_DB \
                     JWT_SECRET SESSION_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
                     CLIENT_URL FRONTEND_URL SERVER_PUBLIC_URL SMTP_HOST SMTP_PORT \
                     SMTP_SECURE SMTP_USER SMTP_PASS EMAIL_FROM ADMIN_EMAIL \
                     SUPER_ADMIN_EMAIL SUPER_ADMIN_PASSWORD GEMINI_API_KEY \
                     GEMINI_MODEL REGCHECK_USERNAME R2_ACCOUNT_ID R2_ACCESS_KEY_ID \
                     R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_ENDPOINT \
                     R2_PUBLIC_URL HTTP_PORT; do
            value="${!var}"
            [ -n "$value" ] && printf '%s=%s\n' "$var" "$value" >> deploy.env
          done
          chmod 600 deploy.env

      - name: Copy files to VPS
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          path="${DEPLOY_PATH:-~/ecom-autoparts}"
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p $path"
          scp -i ~/.ssh/id_deploy -P "${SSH_PORT:-22}" \
            docker-compose.deploy.yml "$SSH_USER@$SSH_HOST:$path/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "${SSH_PORT:-22}" \
            deploy.env "$SSH_USER@$SSH_HOST:$path/.env"

      - name: Pull and restart
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          path="${DEPLOY_PATH:-~/ecom-autoparts}"
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            REGISTRY_USER="$REGISTRY_USER" REGISTRY_TOKEN="$REGISTRY_TOKEN" path="$path" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          # This token is only valid for the lifetime of the workflow run, which
          # is enough to pull the images we just pushed.
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          cd "$path"
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          REMOTE

      - name: Verify health
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
        run: |
          path="${DEPLOY_PATH:-~/ecom-autoparts}"
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            path="$path" HTTP_PORT="${HTTP_PORT:-80}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$path"

          # The API is no longer published on the host, so this runs inside the
          # container. /health returns 503 until MongoDB is actually connected,
          # which is what stops a green deploy on a database-less server.
          for i in $(seq 1 30); do
            if docker compose exec -T server node -e \
                 "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                 >/dev/null 2>&1; then
              echo "API healthy after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API did not become healthy within 150s" >&2
              docker compose ps
              docker compose logs --tail=100 server >&2
              exit 1
            fi
            sleep 5
          done

          # nginx is the only public entry point now, so prove the proxy hop works
          # instead of trusting that a healthy container means a reachable site.
          if ! curl -fsS "http://127.0.0.1:${HTTP_PORT:-80}/api/message" >/dev/null 2>&1; then
            echo "nginx is not proxying /api through to the server container" >&2
            docker compose logs --tail=50 client >&2
            exit 1
          fi
          echo "nginx /api proxy reachable"

          docker compose ps
          REMOTE
