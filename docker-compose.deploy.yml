# Production deployment compose, used on the VPS by .github/workflows/cd.yml.
#
# Unlike docker-compose.dev.yml / docker-compose.prod.yml this file does NOT build
# from source and does NOT bind-mount the repo over the image. It pulls the images
# that CI already built and pushed to GHCR.
#
# Values come from the .env file the deploy workflow writes next to this file.
# ${VAR:?...} makes compose fail immediately with a readable message rather than
# starting a container that crash-loops on a missing secret.

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    # Deliberately NOT published to the host. Only the server container needs
    # MongoDB, and exposing 27017 on a public VPS is how these get compromised.
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ecom-autoparts}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    restart: unless-stopped
    # Reached only through the client container's nginx /api proxy, so there is
    # nothing to publish on the host. Same reasoning as mongo above: a port open
    # on a public IP is a port someone will find.
    expose:
      - "5000"
    environment:
      PORT: 5000
      NODE_ENV: production

      MONGO_IP: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB:-ecom-autoparts}

      # No default in code - auth breaks silently if this is missing.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}

      # config/stripe.js throws at require-time when this is unset, so the
      # container will not even boot without it.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-${CLIENT_URL}}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Only read by `npm run seed`, which creates the first super admin.
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}

      # adminAnalyticsController returns 502 "AI assistant unavailable" without a
      # key. GEMINI_MODEL is optional - the controller falls back through a list.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    depends_on:
      mongo:
        condition: service_healthy

  client:
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE is required}
    restart: unless-stopped
    ports:
       - "80:80"
       - "443:443"
    depends_on:
      - server

volumes:
  mongodb_data:
