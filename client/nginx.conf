server {
    listen 80;
    server_name automobiles.live;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Product image uploads pass through this proxy; nginx's 1m default would
    # reject them with a 413 before the request ever reached the server.
    client_max_body_size 10m;

    # Docker's embedded DNS. Resolving the upstream lazily through a variable keeps
    # nginx booting when the server container is briefly absent - with a literal
    # host in proxy_pass, nginx exits at startup on "host not found in upstream"
    # and takes the entire frontend down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream server:5000;

    # Same-origin API. The browser calls /api on this port and nginx forwards it
    # over the compose network, so the server container needs no published port
    # and VITE_API_URL can stay a relative path.
    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Checkout can sit behind a slow Stripe call; the 60s default is tight.
        proxy_read_timeout 120s;
    }

    # Uploaded images and generated shipping labels are written to the server
    # container's disk at runtime, so they are not part of this bundle.
    # See server/index.js - express serves both as static directories.
    location ~ ^/(uploads|labels)/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames into /assets, so they are safe to cache
    # forever. A rebuild changes the hash and therefore the URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading an old bundle
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # react-router uses client-side routing: any unmatched path has to fall back
    # to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name automobiles.live;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # your existing React/API configuration...
